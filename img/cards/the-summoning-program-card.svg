<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- card for "the summoning program" - a flowchart run inside an old terminal, one branch leaving the machine and splitting down the wire -->
  <defs>
    <radialGradient id="sglow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0%" stop-color="#6a3fa0" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#2a1236" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0810" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b48ce0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#0a0810"/>
  <circle cx="640" cy="400" r="420" fill="url(#sglow)"/>

  <!-- the machine: a terminal with its screen and its stand -->
  <rect x="230" y="286" width="430" height="300" rx="20" fill="#120d1a" stroke="#6b5a8e" stroke-width="5"/>
  <rect x="262" y="316" width="366" height="204" rx="8" fill="#0a0810" stroke="#3a2f52" stroke-width="3"/>
  <rect x="425" y="586" width="40" height="24" fill="#2a2238"/>
  <rect x="385" y="610" width="120" height="10" rx="5" fill="#2a2238"/>

  <!-- the flowchart inside the screen: start, a decision, the offering converted to data -->
  <circle cx="310" cy="356" r="12" fill="none" stroke="#b48ce0" stroke-width="3"/>
  <line x1="310" y1="368" x2="310" y2="392" stroke="#b48ce0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M310 396 L346 428 L310 460 L274 428 Z" fill="none" stroke="#e8b7dd" stroke-width="3"/>
  <line x1="346" y1="428" x2="386" y2="428" stroke="#b48ce0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="388" y="408" width="96" height="40" rx="6" fill="none" stroke="#6b5a8e" stroke-width="3"/>
  <text x="436" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#9c8fc0">bodies</text>
  <text x="436" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b5a8e">as data</text>

  <!-- the wire leaves the machine and splits: three nodes on the far side of the network -->
  <line x1="484" y1="428" x2="640" y2="428" stroke="#5aa7ff" stroke-width="3" stroke-dasharray="10 8" opacity="0.85"/>
  <line x1="680" y1="428" x2="1010" y2="428" stroke="#5aa7ff" stroke-width="3" stroke-dasharray="10 8" opacity="0.75"/>
  <line x1="1010" y1="428" x2="1104" y2="356" stroke="#5aa7ff" stroke-width="2.5" stroke-dasharray="8 7" opacity="0.6"/>
  <line x1="1010" y1="428" x2="1104" y2="500" stroke="#5aa7ff" stroke-width="2.5" stroke-dasharray="8 7" opacity="0.6"/>
  <circle cx="1010" cy="428" r="10" fill="#0a0810" stroke="#5aa7ff" stroke-width="3"/>
  <circle cx="1112" cy="348" r="11" fill="#0a0810" stroke="#e8b7dd" stroke-width="3"/>
  <circle cx="1112" cy="508" r="11" fill="#0a0810" stroke="#e8b7dd" stroke-width="3"/>
  <circle cx="1180" cy="428" r="11" fill="#0a0810" stroke="#e8b7dd" stroke-width="3"/>

  <!-- title -->
  <text x="640" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#e8b7dd">the summoning program</text>
  <text x="640" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#9c8fc0">1985: devils called into a machine, and sent down the wires</text>
</svg>
