<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0612"/>
  <!-- nested story-frames, each one inside the last, the innermost still drawing itself -->
  <g fill="none" stroke="#ff6ec7">
    <rect x="170" y="120" width="860" height="410" rx="10" stroke-width="4" opacity="0.45"/>
    <rect x="280" y="170" width="640" height="310" rx="10" stroke-width="5" opacity="0.7"/>
    <rect x="390" y="220" width="420" height="210" rx="10" stroke-width="6"/>
    <rect x="500" y="270" width="200" height="110" rx="10" stroke-width="7" stroke-dasharray="14 10"/>
    <path d="M560 325 h80 m-40 -40 v80" stroke="#ffd7ef" stroke-width="5"/>
  </g>
  <text x="600" y="95" text-anchor="middle" fill="#ff6ec7" font-family="Georgia, serif" font-size="64" font-weight="bold">hypersigils</text>
  <text x="600" y="585" text-anchor="middle" fill="#ffd7ef" font-family="Georgia, serif" font-size="30" font-style="italic">a sigil that is also a story, lived from the inside — morrison's fourth-dimensional spell</text>
</svg>
