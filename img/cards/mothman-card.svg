<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0612"/>
  <!-- mothman: swept wings, a small dark body, and two red eyes that are the whole point -->
  <g fill="none" stroke="#ff6ec7" stroke-width="5">
    <path d="M600 330 q-160 -180 -330 -140 q60 60 130 90 q-70 10 -60 40 q90 10 180 -10" opacity="0.9"/>
    <path d="M600 330 q160 -180 330 -140 q-60 60 -130 90 q70 10 60 40 q-90 10 -180 -10" opacity="0.9"/>
    <path d="M600 340 q-90 90 -60 170 q40 -20 60 -60 q20 40 60 20 q30 -80 -60 -130z" opacity="0.8"/>
  </g>
  <circle cx="585" cy="320" r="10" fill="#ff2b4d"/>
  <circle cx="615" cy="320" r="10" fill="#ff2b4d"/>
  <circle cx="585" cy="320" r="4" fill="#0a0612"/>
  <circle cx="615" cy="320" r="4" fill="#0a0612"/>
  <!-- the bridge, far below -->
  <g stroke="#ff6ec7" stroke-width="3" opacity="0.55">
    <line x1="240" y1="560" x2="960" y2="560"/>
    <line x1="300" y1="560" x2="300" y2="500"/><line x1="600" y1="560" x2="600" y2="500"/><line x1="900" y1="560" x2="900" y2="500"/>
    <line x1="300" y1="500" x2="600" y2="500"/><line x1="600" y1="500" x2="900" y2="500"/>
  </g>
  <text x="600" y="95" text-anchor="middle" fill="#ff6ec7" font-family="Georgia, serif" font-size="64" font-weight="bold">mothman</text>
  <text x="600" y="585" text-anchor="middle" fill="#ffd7ef" font-family="Georgia, serif" font-size="30" font-style="italic">the red-eyed thing over point pleasant, and the bridge that fell thirteen months later</text>
</svg>
