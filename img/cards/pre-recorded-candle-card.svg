<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- the pre-recorded candle: a flame whose every flicker was written in 2025 -->
  <defs>
    <radialGradient id="glow" cx="40%" cy="72%" r="38%">
      <stop offset="0%" stop-color="#ffb45a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffb45a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#07030c"/>
  <circle cx="440" cy="450" r="300" fill="url(#glow)"/>

  <!-- the candle: stick, flame breathing on a sine, halo behind it -->
  <rect x="425" y="440" width="30" height="110" rx="4" fill="#3a2418"/>
  <g>
    <path d="M440 320 C 480 400 478 440 440 440 C 402 440 400 400 440 320 Z"
          fill="#ffb45a" opacity="0.92"/>
    <path d="M442 356 C 456 410 452 432 440 436 C 428 432 424 412 442 356 Z"
          fill="#ffe9d0" opacity="0.8"/>
  </g>
  <path d="M440 320 q 12 26 0 46 q -12 -20 0 -46" fill="none" stroke="#ffd7a8" stroke-width="2" opacity="0.35"/>

  <!-- the cloud beside it, with the word inside -->
  <g opacity="0.9">
    <ellipse cx="860" cy="400" rx="150" ry="78" fill="#ffffff" fill-opacity="0.055"/>
    <ellipse cx="790" cy="416" rx="80" ry="52" fill="#ffffff" fill-opacity="0.05"/>
    <ellipse cx="930" cy="416" rx="90" ry="56" fill="#ffffff" fill-opacity="0.045"/>
    <ellipse cx="860" cy="380" rx="100" ry="44" fill="#ffffff" fill-opacity="0.04"/>
  </g>
  <text x="860" y="412" text-anchor="middle" fill="#ffe9d0"
        font-family="Georgia, serif" font-style="italic" font-size="54">ember</text>

  <!-- the data itself: a flicker trace running under the candle -->
  <g stroke="#ff6ec7" stroke-width="2" fill="none" opacity="0.5">
    <polyline points="80,560 120,540 160,556 200,524 200,588 240,536 280,552 320,520 360,548 400,516"/>
  </g>

  <text x="600" y="120" text-anchor="middle" fill="#ff6ec7"
        font-family="Georgia, serif" font-size="62" font-weight="bold">the pre-recorded candle</text>
  <text x="600" y="585" text-anchor="middle" fill="#ffd7ef" font-family="Georgia, serif" font-size="30" font-style="italic">the flicker was written in 2025. your ten minutes are happening now.</text>
</svg>
