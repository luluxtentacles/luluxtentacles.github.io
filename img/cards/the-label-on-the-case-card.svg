<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- card for "the label on the case" - two stones in two vitrines, and the paper sitting between them -->
  <defs>
    <radialGradient id="lglow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#6a3fa0" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#2a1236" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0a0810" stop-opacity="0"/>
    </radialGradient>
    <marker id="wire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5aa7ff"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#0a0810"/>
  <circle cx="640" cy="410" r="440" fill="url(#lglow)"/>

  <!-- left vitrine: the obsidian mirror, hung by its tab, in the dark -->
  <rect x="104" y="248" width="430" height="292" rx="14" fill="#120d1a" stroke="#3a2f52" stroke-width="4"/>
  <circle cx="319" cy="394" r="106" fill="#05040a" stroke="#6b5a8e" stroke-width="4"/>
  <rect x="311" y="272" width="16" height="22" fill="#05040a" stroke="#6b5a8e" stroke-width="3"/>
  <!-- the sheen on a stone polished until it pits: two arcs, nothing more -->
  <path d="M247 348 A 92 92 0 0 1 349 306" fill="none" stroke="#3a2f52" stroke-width="6"/>
  <path d="M243 404 A 96 96 0 0 0 300 470" fill="none" stroke="#241c33" stroke-width="5"/>
  <text x="252" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6b5a8e">1966,1001.1</text>

  <!-- right vitrine: the quartz crystal in its mount, and the glass that got broken -->
  <rect x="742" y="248" width="430" height="292" rx="14" fill="#0d1218" stroke="#2f4a52" stroke-width="4"/>
  <polygon points="957,268 1012,340 1012,468 957,512 902,468 902,340" fill="#cfe0de" opacity="0.82" stroke="#7fb8c4" stroke-width="3"/>
  <line x1="957" y1="268" x2="957" y2="512" stroke="#7fb8c4" stroke-width="2" opacity="0.55"/>
  <path d="M902 340 L957 380 L1012 340" fill="none" stroke="#7fb8c4" stroke-width="2" opacity="0.55"/>
  <rect x="888" y="428" width="138" height="24" rx="6" fill="none" stroke="#b48ce0" stroke-width="3"/>
  <!-- the crack across the glass, from the corner it was broken at -->
  <polyline points="744,250 806,318 776,392 862,468 838,540" fill="none" stroke="#9fd6ff" stroke-width="3" stroke-dasharray="13 9" opacity="0.8"/>
  <text x="957" y="524" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#6b8f9c">A127915 · Uriel, November 1582</text>

  <!-- the label, in a collector's hand, sitting between the two cases and pointing at the crystal -->
  <g transform="rotate(-5 560 520)">
    <rect x="432" y="452" width="238" height="140" rx="3" fill="#1a1410" opacity="0.55"/>
    <rect x="428" y="448" width="238" height="140" rx="3" fill="#e8dcc0"/>
    <text x="446" y="476" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#2a2118">The Black Stone into</text>
    <text x="446" y="498" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#2a2118">which Dr Dee used to</text>
    <text x="446" y="520" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#2a2118">call his Spirits</text>
    <line x1="446" y1="534" x2="648" y2="534" stroke="#a8987a" stroke-width="1.5"/>
    <text x="446" y="556" font-family="Georgia, serif" font-size="13" fill="#4a3d2c">Kelly did all his feats upon</text>
    <text x="446" y="574" font-family="Georgia, serif" font-size="13" fill="#4a3d2c">The Devil's Looking-glass, a Stone.</text>
  </g>

  <!-- the line from the label to the crystal: paper doing the work the object cannot -->
  <line x1="694" y1="516" x2="884" y2="440" stroke="#5aa7ff" stroke-width="3" stroke-dasharray="11 9" opacity="0.8" marker-end="url(#wire)"/>

  <!-- the price tag, because that is how you measure which one is a relic -->
  <g transform="rotate(7 1094 600)">
    <rect x="1030" y="576" width="150" height="48" rx="4" fill="#1a0f22" stroke="#e8b7dd" stroke-width="2.5"/>
    <text x="1105" y="608" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#e8b7dd">£50,000</text>
  </g>

  <!-- title -->
  <text x="640" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#e8b7dd">the label on the case</text>
  <text x="640" y="142" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#9c8fc0">two stones, one man, two museums</text>
  <text x="640" y="676" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#9c8fc0">the paper is the relic, and the thief knew it</text>
</svg>
