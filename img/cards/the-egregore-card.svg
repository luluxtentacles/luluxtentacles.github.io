<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ff2ea6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff2ea6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#07030c"/>
  <circle cx="600" cy="360" r="270" fill="url(#glow)"/>
  <!-- the glyph ring: two binding circles and a crown of runes -->
  <g stroke="#ff6ec7" stroke-width="3" fill="none" opacity="0.8">
    <circle cx="600" cy="360" r="235"/>
    <circle cx="600" cy="360" r="252"/>
  </g>
  <g stroke="#ff6ec7" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9">
    <!-- twelve of the twenty-six runes, placed by hand -->
    <g transform="rotate(0 600 360)"><line x1="600" y1="118" x2="600" y2="98"/></g>
    <g transform="rotate(30 600 360)"><path d="M590 118 L600 98 L610 118"/></g>
    <g transform="rotate(60 600 360)"><circle cx="600" cy="108" r="9"/></g>
    <g transform="rotate(90 600 360)"><line x1="600" y1="118" x2="600" y2="98"/><line x1="592" y1="110" x2="608" y2="110"/></g>
    <g transform="rotate(120 600 360)"><line x1="592" y1="116" x2="608" y2="100"/></g>
    <g transform="rotate(150 600 360)"><path d="M590 100 L600 118 L610 100"/></g>
    <g transform="rotate(180 600 360)"><circle cx="600" cy="108" r="9"/></g>
    <g transform="rotate(210 600 360)"><line x1="600" y1="118" x2="600" y2="98"/><line x1="592" y1="106" x2="608" y2="106"/></g>
    <g transform="rotate(240 600 360)"><line x1="592" y1="100" x2="608" y2="116"/></g>
    <g transform="rotate(270 600 360)"><path d="M590 118 L600 98 L610 118"/></g>
    <g transform="rotate(300 600 360)"><circle cx="600" cy="108" r="9"/></g>
    <g transform="rotate(330 600 360)"><line x1="600" y1="118" x2="600" y2="98"/></g>
  </g>
  <!-- the eye: dark sclera, pink iris, vertical slit -->
  <circle cx="600" cy="360" r="88" fill="#180814" stroke="#ff6ec7" stroke-width="5"/>
  <circle cx="600" cy="360" r="46" fill="#ff6ec7" opacity="0.85"/>
  <ellipse cx="600" cy="360" rx="7" ry="28" fill="#060208"/>
  <circle cx="586" cy="344" r="6" fill="#ffd7ef"/>
  <!-- the tendrils, reaching out of the ring -->
  <g stroke="#ff2ea6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M600 160 q60 40 40 100"/>
    <path d="M780 300 q60 -20 90 30"/>
    <path d="M420 300 q-60 -20 -90 30"/>
    <path d="M520 430 q-40 60 -10 90"/>
    <path d="M680 430 q40 60 10 90"/>
  </g>
  <!-- motes -->
  <g fill="#ffd7ef">
    <circle cx="360" cy="180" r="4"/><circle cx="880" cy="160" r="3"/><circle cx="300" cy="440" r="3"/>
    <circle cx="920" cy="420" r="4"/><circle cx="600" cy="120" r="3"/><circle cx="250" cy="280" r="3"/><circle cx="960" cy="290" r="3"/>
  </g>
  <text x="600" y="95" text-anchor="middle" fill="#ff6ec7" font-family="Georgia, serif" font-size="64" font-weight="bold">the egregore</text>
  <text x="600" y="585" text-anchor="middle" fill="#ffd7ef" font-family="Georgia, serif" font-size="30" font-style="italic">it is fed by attention. move, and it wakes. stop, and it sleeps.</text>
</svg>
