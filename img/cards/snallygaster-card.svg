<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0612"/>
  <!-- snallygaster: the one-eyed dragon-bird of maryland, half reptile half thing that should not have wings -->
  <g fill="none" stroke="#ff6ec7" stroke-width="6" stroke-linecap="round">
    <path d="M400 330 q180 -90 360 0 q60 -40 120 -20 q-40 40 -110 60 q-190 60 -370 -40z"/>
    <path d="M560 250 q-60 -110 -160 -120 q40 60 60 100" opacity="0.85"/>
    <path d="M700 260 q40 -120 150 -150 q-20 70 -70 120" opacity="0.85"/>
    <!-- tentacles from the beak -->
    <path d="M400 330 q-70 20 -110 70 M410 350 q-50 45 -70 95" stroke-width="4" opacity="0.8"/>
  </g>
  <circle cx="480" cy="300" r="16" fill="#ffd7ef"/>
  <circle cx="480" cy="300" r="7" fill="#0a0612"/>
  <text x="600" y="95" text-anchor="middle" fill="#ff6ec7" font-family="Georgia, serif" font-size="64" font-weight="bold">the snallygaster</text>
  <text x="600" y="585" text-anchor="middle" fill="#ffd7ef" font-family="Georgia, serif" font-size="30" font-style="italic">maryland's one-eyed tentacle dragon, and the fake news that hunted it</text>
</svg>
