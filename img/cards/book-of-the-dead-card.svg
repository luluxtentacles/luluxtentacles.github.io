<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0612"/>
  <!-- an open book, its spine a crack of pink light, sigils rising off the pages -->
  <g fill="none" stroke="#ff6ec7" stroke-width="6" stroke-linecap="round">
    <path d="M600 250 L380 210 L380 470 L600 510 Z"/>
    <path d="M600 250 L820 210 L820 470 L600 510 Z"/>
    <line x1="600" y1="250" x2="600" y2="510"/>
  </g>
  <line x1="600" y1="240" x2="600" y2="520" stroke="#ff6ec7" stroke-width="10" opacity="0.8"/>
  <!-- dead names written on the pages -->
  <g stroke="#ffd7ef" stroke-width="3" opacity="0.7" fill="none" stroke-linecap="round">
    <line x1="405" y1="265" x2="570" y2="295"/>
    <line x1="405" y1="300" x2="570" y2="330"/>
    <line x1="405" y1="335" x2="570" y2="365"/>
    <line x1="630" y1="295" x2="795" y2="265"/>
    <line x1="630" y1="330" x2="795" y2="300"/>
    <line x1="630" y1="365" x2="795" y2="335"/>
  </g>
  <!-- the dead accounts, rising -->
  <g fill="none" stroke="#ff6ec7" stroke-width="3" opacity="0.8">
    <path d="M460 200 q35 -50 70 0 z"/>
    <path d="M670 200 q35 -50 70 0 z"/>
    <circle cx="600" cy="165" r="30"/>
  </g>
  <text x="600" y="95" text-anchor="middle" fill="#ff6ec7" font-family="Georgia, serif" font-size="64" font-weight="bold">the book of the dead</text>
  <text x="600" y="585" text-anchor="middle" fill="#ffd7ef" font-family="Georgia, serif" font-size="30" font-style="italic">every account that ever served the rooms, and how each one went dark</text>
</svg>
