<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#ff2ea6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff2ea6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="16%" stop-color="#ff9f43"/>
      <stop offset="33%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="66%" stop-color="#38bdf8"/>
      <stop offset="83%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#07030c"/>
  <circle cx="600" cy="340" r="330" fill="url(#glow)"/>

  <!-- the trail, wide enough to read at card size -->
  <rect x="90" y="298" width="1020" height="30" rx="15" fill="url(#rainbow)" opacity="0.85"/>

  <!-- three days, and it is that narrow -->
  <line x1="750" y1="272" x2="1030" y2="272" stroke="#ffd7ef" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="750" y1="264" x2="750" y2="280" stroke="#ffd7ef" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="1030" y1="264" x2="1030" y2="280" stroke="#ffd7ef" stroke-opacity="0.5" stroke-width="2"/>
  <text x="890" y="254" text-anchor="middle" fill="#ffd7ef" opacity="0.7" font-family="monospace" font-size="21">three days</text>

  <!-- the four pieces -->
  <g fill="#07030c" stroke="#ffd7ef" stroke-width="4">
    <circle cx="190" cy="313" r="12"/>
    <circle cx="470" cy="313" r="12"/>
    <circle cx="750" cy="313" r="12"/>
    <circle cx="1030" cy="313" r="12"/>
  </g>

  <g font-family="monospace" text-anchor="middle">
    <text x="190" y="378" fill="#ffd7ef" opacity="0.9" font-size="22">25 jul 2010</text>
    <text x="190" y="404" fill="#ffd7ef" opacity="0.55" font-size="19">the song</text>

    <text x="470" y="378" fill="#ffd7ef" opacity="0.9" font-size="22">30 jan 2011</text>
    <text x="470" y="404" fill="#ffd7ef" opacity="0.55" font-size="19">the cover</text>

    <text x="750" y="378" fill="#ffd7ef" opacity="0.9" font-size="22">2 apr 2011</text>
    <text x="750" y="404" fill="#ffd7ef" opacity="0.55" font-size="19">the drawing</text>

    <text x="1030" y="378" fill="#ffd7ef" opacity="0.9" font-size="22">5 apr 2011</text>
    <text x="1030" y="404" fill="#ffd7ef" opacity="0.55" font-size="19">the mashup</text>
    <text x="1030" y="430" fill="#ff6ec7" opacity="0.95" font-size="19">and the name</text>
  </g>

  <text x="600" y="128" text-anchor="middle" fill="#ff6ec7" font-family="Georgia, serif" font-size="64" font-weight="bold">the internet</text>
  <text x="600" y="200" text-anchor="middle" fill="#ff6ec7" font-family="Georgia, serif" font-size="64" font-weight="bold">reached a decision</text>

  <text x="600" y="512" text-anchor="middle" fill="#ffd7ef" font-family="Georgia, serif" font-size="27" font-style="italic">four authors, one dead cat, and a name that came off the soundtrack</text>
</svg>
