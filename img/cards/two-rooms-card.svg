<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="rose" cx="28%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff2ea6" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ff2ea6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff2ea6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="72%" cy="45%" r="55%">
