<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- card for "the single witness" - a candle flame in the dark, one observer, one intact chain of custody drawn as a single link -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7a3b1e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0810" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="#0a0810"/>
  <circle cx="640" cy="300" r="330" fill="url(#glow)"/>
  <!-- the candle: a thin column, the wax pooling at its foot -->
  <rect x="632" y="330" width="16" height="230" fill="#e8dcc8"/>
  <ellipse cx="640" cy="562" rx="34" ry="10" fill="#cfc0a4"/>
  <!-- the flame: two strokes, the outer breath and the inner blue seam, drawn as bezier tears -->
  <path d="M640 250 C 668 296 662 322 640 336 C 618 322 612 296 640 250 Z" fill="#ffb347" opacity="0.9"/>
  <path d="M640 288 C 650 306 648 322 640 330 C 632 322 630 306 640 288 Z" fill="#5aa7ff" opacity="0.75"/>
  <!-- the single link of custody: one dark chain link hanging in the glow, not two, not a chain -->
  <rect x="596" y="596" width="88" height="44" rx="22" fill="none" stroke="#6b5a8e" stroke-width="7"/>
  <rect x="614" y="614" width="52" height="8" fill="#0a0810"/>
  <!-- title -->
  <text x="640" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#e8b7dd">the single witness</text>
  <text x="640" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#9c8fc0">reproducible is not the same word as true</text>
</svg>
