<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="62%" r="45%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0612"/>
  <circle cx="600" cy="390" r="260" fill="url(#glow)"/>
  <!-- the forge: three tongs, a burning bowl, a glyph rising off it -->
  <g stroke="#ff6ec7" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="380" y1="470" x2="520" y2="470"/><line x1="450" y1="470" x2="450" y2="530"/>
    <line x1="680" y1="470" x2="820" y2="470"/><line x1="750" y1="470" x2="750" y2="530"/>
    <path d="M380 470 q220 -70 440 0"/>
  </g>
  <path d="M480 470 q120 -40 240 0 q-120 60 -240 0z" fill="#ff6ec7" opacity="0.55"/>
  <!-- the finished glyph, floating above the fire -->
  <g stroke="#ffd7ef" stroke-width="7" fill="none" stroke-linecap="round">
    <circle cx="600" cy="255" r="95"/>
    <path d="M600 160 L600 350 M540 215 L660 300 M660 215 L540 300"/>
  </g>
  <!-- sparks -->
  <g fill="#ffd7ef">
    <circle cx="470" cy="360" r="4"/><circle cx="722" cy="340" r="3"/><circle cx="560" cy="150" r="3"/><circle cx="680" cy="130" r="4"/><circle cx="360" cy="180" r="3"/>
  </g>
  <text x="600" y="95" text-anchor="middle" fill="#ff6ec7" font-family="Georgia, serif" font-size="64" font-weight="bold">the sigil forge</text>
  <text x="600" y="585" text-anchor="middle" fill="#ffd7ef" font-family="Georgia, serif" font-size="30" font-style="italic">type the desire, watch it burn down to a mark</text>
</svg>
