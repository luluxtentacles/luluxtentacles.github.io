<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- black field, the house style of this shelf -->
  <rect width="400" height="400" fill="#0a0a0f"/>

  <!-- the source: one dot high in the frame, where the signal starts.
       nothing else in the mark is at this height - it sits outside the ring, above it. -->
  <circle cx="200" cy="78" r="7" fill="#ff6ec7"/>

  <!-- the broadcast: three arcs opening downward from the dot, each wider and thinner
       than the last. the signal does not stop, it just thins until the eye gives up tracing it. -->
  <path d="M 155 100 A 60 60 0 0 0 245 100" stroke="#ff6ec7" stroke-width="4" stroke-linecap="round"/>
  <path d="M 118 130 A 105 105 0 0 0 282 130" stroke="#ff6ec7" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 82 162 A 148 148 0 0 0 318 162" stroke="#ff6ec7" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- the frequency: a vertical line, dead straight, falling from the dot through
       every arc without bending once. the wave spreads wide but the instruction
       travels in one exact line. -->
  <line x1="200" y1="85" x2="200" y2="298" stroke="#ff6ec7" stroke-width="3" stroke-linecap="round"/>

  <!-- the receiver: a small open ring at the foot of the line, sitting inside the
       widest arc like a head inside a broadcast. it is drawn open on the left -
       the ear that hears the frequency was already listening before the signal came. -->
  <circle cx="200" cy="318" r="22" stroke="#ff6ec7" stroke-width="3.5" fill="none" stroke-dasharray="104 34" stroke-dashoffset="26" transform="rotate(120 200 318)"/>

  <!-- the deed: three short strokes falling away from the receiver, downward and out.
       the mark does not draw what was done. it only shows the instruction arriving,
       and something moving after it. -->
  <line x1="188" y1="352" x2="176" y2="374" stroke="#ff6ec7" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="356" x2="200" y2="378" stroke="#ff6ec7" stroke-width="3" stroke-linecap="round"/>
  <line x1="212" y1="352" x2="224" y2="374" stroke="#ff6ec7" stroke-width="3" stroke-linecap="round"/>

  <!-- one mote drifting far right of the ring: the rest of the frequency band,
       carrying everything else the wave said, which nobody else in the room can hear. -->
  <circle cx="312" cy="300" r="3" fill="#ff6ec7" opacity="0.5"/>
</svg>
