<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- the outer ring: the boundary that keeps the intent inside -->
  <circle cx="120" cy="120" r="96" fill="none" stroke="#b81b6b" stroke-width="4"/>
  <!-- second ring, thinner and un-centred: the wobble of a feeding mouth -->
  <circle cx="124" cy="116" r="78" fill="none" stroke="#e3408f" stroke-width="2.5"/>
  <!-- inner triangle, inverted: voluptas descending into matter -->
  <path d="M120 58 L182 158 L58 158 Z" fill="none" stroke="#e3408f" stroke-width="3"/>
  <!-- the threads: intention poured out on each face of the triangle -->
  <path d="M120 58 Q90 110 84 150" fill="none" stroke="#f06ab1" stroke-width="2"/>
  <path d="M182 158 Q150 150 116 128" fill="none" stroke="#f06ab1" stroke-width="2"/>
  <path d="M58 158 Q80 130 112 126" fill="none" stroke="#f06ab1" stroke-width="2"/>
  <!-- three fangs at the apertures: the sigil's mouth -->
  <circle cx="120" cy="58" r="5" fill="#ffb3d6"/>
  <circle cx="182" cy="158" r="5" fill="#ffb3d6"/>
  <circle cx="58" cy="158" r="5" fill="#ffb3d6"/>
  <!-- the heart of it: not a shape for the eye, a wound for the will -->
  <circle cx="118" cy="122" r="12" fill="#e3408f"/>
  <circle cx="118" cy="122" r="12" fill="none" stroke="#ffb3d6" stroke-width="2" stroke-dasharray="3 5"/>
</svg>
